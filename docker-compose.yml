# PostgreSQL local para desenvolvimento. Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ipeia
      POSTGRES_PASSWORD: ipeia
      POSTGRES_DB: ipeia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

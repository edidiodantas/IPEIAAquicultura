[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipeia"
version = "0.1.0"
description = "Assistente de gestão aquícola via WhatsApp (IPEIAAquicultura)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
whisper-local = ["faster-whisper>=1.0"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8", "pypdf>=4.0"]

[project.scripts]
ipeia = "ipeia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
